services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_dev_password
      POSTGRES_DB: credit_risk
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d credit_risk"]
      interval: 5s
      timeout: 3s
      retries: 5

  python-lightgbm:
    build:
      context: .
      dockerfile: python/Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  aegis-web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run build && NODE_ENV=production npx tsx server.ts"
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://aegis:aegis_dev_password@postgres:5432/credit_risk
      SCORING_API_URL: http://python-lightgbm:8000
      ALLOW_MEMORY_FALLBACK: "false"
      ALLOW_PYTHON_FALLBACK: "false"
    depends_on:
      postgres:
        condition: service_healthy
      python-lightgbm:
        condition: service_healthy
